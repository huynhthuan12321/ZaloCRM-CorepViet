<html lang="vi"><head><meta charset="utf-8"><meta name="color-scheme" content="light only"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Cờ Rếp Việt · Đề xuất iPhone</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b36;background:#edf2f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit;background:none}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #1786be;outline-offset:2px}.stage{min-height:100vh;display:grid;place-items:center;padding:26px}.caption{font-size:12px;color:#647870;text-align:center;margin:0 0 14px;letter-spacing:.04em}.phone{width:390px;height:844px;border:1px solid #c5d5ce;border-radius:38px;box-shadow:0 24px 80px #153d2925;overflow:hidden;background:#f7f9fc;display:flex;flex-direction:column;position:relative}.status{height:42px;flex:none;display:flex;justify-content:space-between;padding:15px 25px 0;font-size:13px;font-weight:700;background:#fff}.status .island{width:94px;height:22px;background:#132a23;border-radius:18px;margin-top:-6px}.top{background:#fff;padding:10px 20px 14px;border-bottom:1px solid #e6eeea;flex:none}.eyebrow{font-size:10px;font-weight:800;color:#0b5880;letter-spacing:.12em;text-transform:uppercase}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}.top h1{font-size:28px;letter-spacing:-.8px;margin:0;font-weight:750}.icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:21px;background:#f1f6f3;flex:none}.dot{position:relative}.dot:after{content:"";position:absolute;right:11px;top:10px;width:6px;height:6px;border-radius:50%;background:#e7985b;border:2px solid white;box-sizing:content-box}.search{display:flex;gap:10px;align-items:center;background:#f0f5f2;border-radius:13px;padding:0 13px;margin-top:15px;height:44px;color:#789085}.search input{background:transparent;border:0;outline:none;min-width:0;width:100%;font-size:16px}.chips{display:flex;gap:7px;margin-top:13px;overflow:auto}.chip{white-space:nowrap;font-size:12px;font-weight:650;border:1px solid #e1eae4;border-radius:11px;min-height:36px;padding:0 12px}.chip.active{background:#0b5880;color:white;border-color:#0b5880}.content{overflow:auto;min-height:0;flex:1}.section{padding:20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 13px}.section-title h2{font-size:17px;margin:0;letter-spacing:-.3px}.section-title small{font-size:11px;color:#7a8b82}.row{display:flex;align-items:center;gap:12px;padding:17px 20px;background:#fff;width:100%;text-align:left;border-bottom:1px solid #edf2ef}.avatar{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:17px;font-size:15px;font-weight:750;background:#e6efe9;color:#3d6c56;position:relative}.avatar.blue{background:#e8eef5;color:#566e8b}.avatar.sand{background:#f5eddf;color:#94733e}.avatar:after{content:"";width:9px;height:9px;border:2px solid white;background:#5b9f7b;border-radius:50%;position:absolute;bottom:-2px;right:-2px}.row-text{min-width:0;flex:1}.row-title{display:flex;align-items:center;justify-content:space-between;gap:5px}.row-title strong{font-size:14px}.time{font-size:10px;color:#95a49b;font-weight:400}.preview{font-size:12px;color:#6f8177;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 0}.meta{font-size:10px;color:#84978b;display:flex;align-items:center;gap:6px}.badge{font-size:10px;background:#e8f1e9;color:#527b5a;border-radius:5px;padding:3px 5px}.unread{background:#1786be;color:#fff;border-radius:10px;min-width:19px;text-align:center;padding:3px;font-size:10px}.subbar{display:flex;align-items:center;justify-content:space-between;padding:13px 20px;font-size:11px;color:#6c8175}.subbar b{color:#295940}.nav{height:83px;flex:none;display:flex;align-items:flex-start;justify-content:space-around;padding:10px 6px max(13px,env(safe-area-inset-bottom));background:white;border-top:1px solid #e4ece7}.nav button{display:flex;align-items:center;flex-direction:column;gap:4px;color:#91a196;min-width:60px;min-height:48px;padding:3px 0;font-size:9px}.nav button span{font-size:21px;line-height:24px}.nav button.active{color:#1786be;font-weight:700}.nav button.active span{background:#e9f2eb;border-radius:10px;width:42px}.card{padding:17px;background:white;border:1px solid #e5ede7;border-radius:19px;margin-bottom:12px}.welcome{font-size:12px;color:#6b8174;line-height:1.6;margin:0 0 18px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:24px}.kpi{border:1px solid #e0eae3;background:#fff;border-radius:19px;padding:15px}.kpi:first-child{background:#214c3b;color:white;border-color:#214c3b}.kpi small{font-size:11px;opacity:.75}.kpi strong{display:block;font-size:30px;letter-spacing:-1px;margin:9px 0 5px}.kpi p{font-size:10px;margin:0;opacity:.65}.priority{display:flex;align-items:center;gap:10px}.priority .avatar{width:40px;height:40px;border-radius:14px}.priority strong{font-size:13px}.priority p{font-size:11px;color:#7b8b80;margin:5px 0}.arrow{margin-left:auto;color:#879d8c}.primary{background:#1786be;color:#fff;min-height:46px;border-radius:13px;padding:0 18px;font-size:13px;font-weight:650}.outline{border:1px solid #dce8df;background:white;min-height:44px;border-radius:13px;padding:0 17px;font-size:12px}.thread-top{display:flex;align-items:center;gap:8px;background:#fff;border-bottom:1px solid #e4ece7;padding:8px 12px 12px}.thread-top .avatar{width:40px;height:40px;border-radius:14px}.thread-name{flex:1}.thread-name strong{font-size:14px}.thread-name small{display:block;font-size:10px;color:#6d8a77;margin-top:4px}.thread-top .icon{background:transparent;width:38px}.messages{flex:1;overflow:auto;padding:20px 16px;min-height:0;background:radial-gradient(#dde8e0 .7px,transparent .7px) 0 0/14px 14px}.day{text-align:center;font-size:10px;color:#95a398;margin-bottom:22px}.bubble{background:#fff;border:1px solid #e4ece5;max-width:83%;padding:12px 14px;border-radius:17px 17px 17px 4px;font-size:13px;line-height:1.6;margin-bottom:12px;box-shadow:0 2px 3px #35543b03}.bubble.mine{margin-left:auto;background:#dfeee4;border-color:#d6e7db;border-radius:17px 17px 4px 17px}.bubble small{display:block;text-align:right;color:#8ca18f;font-size:9px;margin-top:5px}.asset{background:#f0f5ef;padding:12px;border-radius:10px;margin-bottom:5px;display:flex;gap:9px;align-items:center}.compose{padding:10px 14px max(22px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e4ece7}.tools{display:flex;justify-content:space-between;color:#72907d;font-size:10px;margin:0 5px 9px}.tools button{font-size:11px;min-height:32px}.composer{display:flex;align-items:center;gap:7px}.composer textarea{height:44px;resize:none;width:100%;min-width:0;border:1px solid #e3ece6;border-radius:13px;background:#f6f8f6;padding:11px;font-size:16px}.composer .icon{background:#1786be;color:white;border-radius:13px}.composer .plus{background:#eef5ee;color:#3c6950}.profile-head{text-align:center;background:white;padding:22px 20px}.profile-head .avatar{margin:auto;width:72px;height:72px;font-size:22px;border-radius:25px}.profile-head h2{font-size:21px;margin:13px 0 6px}.profile-head p{font-size:12px;color:#7a8e80;margin:0 0 18px}.profile-actions{display:flex;gap:9px;justify-content:center}.field{padding:12px 0;border-bottom:1px solid #eef2ef;display:flex;justify-content:space-between;font-size:12px;gap:10px}.field:last-child{border:0}.field span{color:#849386}.field b{font-weight:550}.dates{display:flex;gap:8px;margin-bottom:20px}.date{flex:1;background:white;text-align:center;border-radius:13px;border:1px solid #e3eae4;padding:11px 0;font-size:11px;color:#8b9b90}.date b{display:block;margin-top:7px;font-size:16px;color:#345943}.date.active{background:#1786be;color:#b5d0bc}.date.active b{color:white}.appointment{display:flex;gap:13px}.clock{min-width:46px;font-size:12px;font-weight:700;color:#54795e;padding-top:4px}.appointment h3{font-size:13px;margin:0 0 6px}.appointment p{font-size:11px;color:#8a9b8e;margin:0}.rule{width:3px;border-radius:5px;background:#7dac8a;flex:none}.menu-row{display:flex;justify-content:space-between;min-height:51px;align-items:center;font-size:13px;border-bottom:1px solid #ecf1ed}.muted{font-size:11px;color:#829487;line-height:1.6}.shade{position:absolute;inset:0;background:#102a2355;z-index:10;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;padding:10px 23px 26px;border-radius:26px 26px 0 0;box-shadow:0 -10px 50px #183f2220}.handle{width:35px;height:4px;background:#d5dfd8;border-radius:4px;margin:0 auto 18px}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet-head h2{font-size:19px;margin:0}.sheet-body{background:#f3f7f3;border:1px solid #e3ece4;border-radius:15px;padding:15px;font-size:13px;line-height:1.7;margin:15px 0}.sheet .primary{width:100%}.proto-note{font-size:10px;text-align:center;color:#8c9e91;line-height:1.7;margin-top:14px}.toast{position:absolute;left:25px;right:25px;bottom:96px;padding:13px 16px;background:#234b3eee;color:white;font-size:12px;border-radius:14px;z-index:15;box-shadow:0 6px 20px #14372820}.hidden{display:none!important}@media(max-width:460px){.stage{padding:0}.caption{display:none}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}.status{padding-top:max(15px,env(safe-area-inset-top))}}@media(prefers-reduced-motion:no-preference){.content,.messages{scroll-behavior:smooth}}
</style></head><body><div class="stage"><div><p class="caption">CỜ RẾP VIỆT / MOBILE EXPLORATION — 390 × 844</p><main class="phone" aria-label="Prototype iPhone — dữ liệu giả"><div class="status"><span>9:41</span><div class="island"></div><span>▮▮▮ ▰</span></div><div id="view" style="display:contents"></div><nav class="nav" id="nav" aria-label="Điều hướng prototype"></nav><div id="overlay"></div></main></div></div>
<script>
const people=[{name:'Anh Nam',initials:'AN',text:'Cho mình xin thêm thông tin gói setup nhé.',time:'10:42',sale:'Minh Anh',tag:'Quan tâm',unread:'2',color:''},{name:'Chị Linh',initials:'CL',text:'Bạn: Em đã gửi tài liệu cho chị rồi ạ.',time:'10:28',sale:'Tuấn Minh',tag:'Đã liên hệ',color:'sand'},{name:'Anh Hoàng',initials:'AH',text:'Cảm ơn em, anh sẽ xem lại.',time:'09:54',sale:'Minh Anh',tag:'Khách mới',unread:'1',color:'blue'},{name:'Chị Mai',initials:'CM',text:'Bạn: Dạ, hẹn chị vào chiều mai nhé.',time:'09:15',sale:'Tuấn Minh',tag:'Lịch hẹn',color:''},{name:'Anh Phúc',initials:'AP',text:'Bên mình hỗ trợ giao hàng thế nào?',time:'Hôm qua',sale:'Minh Anh',tag:'Quan tâm',color:'sand'}];
let page='inbox',selected=0,filter='Tất cả';const view=document.getElementById('view'),nav=document.getElementById('nav'),overlay=document.getElementById('overlay');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar=p=>`<span class="avatar ${p.color}">${p.initials}</span>`;
function header(title,eyebrow='KHÔNG GIAN LÀM VIỆC',action='notification'){return `<header class="top"><div class="eyebrow">${eyebrow}</div><div class="topline"><h1>${title}</h1><button class="icon dot" data-action="${action}" aria-label="Thông báo giả lập">♧</button></div></header>`}
function rows(customer=false,query=''){return people.map((p,i)=>({p,i})).filter(({p})=>(!query||p.name.toLowerCase().includes(query.toLowerCase()))&&(filter==='Tất cả'||!(!p.unread))).map(({p,i})=>`<button class="row" data-person="${i}" data-target="${customer?'profile':'thread'}">${avatar(p)}<span class="row-text"><span class="row-title"><strong>${p.name}</strong><span class="time">${customer?`<span class="badge">${p.tag}</span>`:p.time}</span></span><span class="preview" style="display:block">${customer?'09•• ••• ••• · Khách hàng mẫu':p.text}</span><span class="meta"><span>● ${p.sale}</span><span>· Nick mẫu A</span></span></span>${!customer&&p.unread?`<span class="unread">${p.unread}</span>`:''}</button>`).join('')||'<div class="section muted">Không có kết quả. Thử tên khách khác.</div>'}
function render(){overlay.innerHTML='';nav.classList.toggle('hidden',['thread','profile'].includes(page));if(page==='inbox'||page==='customers'){const customer=page==='customers';view.innerHTML=header(customer?'Khách hàng':'Hội thoại')+`<div class="top" style="padding-top:0"><label class="search">⌕<input id="search" aria-label="Tìm khách mẫu" placeholder="${customer?'Tìm tên hoặc số điện thoại':'Tìm cuộc trò chuyện'}"></label><div class="chips">${['Tất cả','Chưa đọc','Chưa trả lời'].map(x=>`<button class="chip ${filter===x?'active':''}" data-filter="${x}">${x}${x==='Chưa đọc'?' · 3':''}</button>`).join('')}</div></div><div class="content"><div class="subbar"><span>${customer?'5 khách hàng mẫu':'Ưu tiên công việc hôm nay'}</span><b>Phạm vi của tôi ▾</b></div><div id="rows">${rows(customer)}</div><p class="proto-note">Bạn đã xem hết dữ liệu mẫu.<br>Prototype giao diện · Không kết nối CRM thật</p></div>`;document.getElementById('search').oninput=e=>document.getElementById('rows').innerHTML=rows(customer,e.target.value)}else if(page==='thread'){const p=people[selected];view.innerHTML=`<header class="thread-top"><button class="icon" data-page="inbox" aria-label="Quay lại hội thoại">‹</button>${avatar(p)}<div class="thread-name"><strong>${p.name}</strong><small>● Nick mẫu A · Đang kết nối</small></div><button class="icon" data-page="profile" aria-label="Xem hồ sơ khách">ⓘ</button></header><section class="messages" id="messages"><div class="day">Hôm nay · 29 tháng 10</div><div class="bubble">Chào bạn, mình đang tìm hiểu về dịch vụ setup. Bên bạn tư vấn giúp mình nhé.<small>10:38</small></div><div class="bubble mine">Dạ em chào anh. Anh đang quan tâm mô hình và quy mô như thế nào ạ?<small>10:39 · Đã xem</small></div><div class="bubble">Anh muốn xem trước các thông tin cơ bản và quy trình triển khai.<small>10:40</small></div><div class="bubble mine"><div class="asset">▤ <span>Tài liệu giới thiệu<br><span class="muted">Tệp mẫu · 1,2 MB</span></span></div>Em gửi anh tài liệu tham khảo ạ.<small>10:41</small></div><div class="bubble">${p.text}<small>10:42</small></div></section><footer class="compose"><div class="tools"><span>Chỉ mô phỏng · Không gửi thật</span><button data-action="ai">✧ Gợi ý AI</button></div><form class="composer" id="send-form"><button type="button" class="icon plus" data-action="attachment" aria-label="Đính kèm">＋</button><textarea id="draft" aria-label="Tin nhắn mẫu" placeholder="Nhập tin nhắn…"></textarea><button class="icon" aria-label="Thêm tin vào bản mô phỏng">↑</button></form></footer>`;document.getElementById('send-form').onsubmit=e=>{e.preventDefault();const d=document.getElementById('draft');if(!d.value.trim())return;document.getElementById('messages').insertAdjacentHTML('beforeend',`<div class="bubble mine">${esc(d.value)}<small>Chỉ hiển thị trong prototype</small></div>`);d.value='';document.getElementById('messages').scrollTop=99999}}else if(page==='profile'){const p=people[selected];view.innerHTML=`<header class="thread-top"><button class="icon" data-page="customers" aria-label="Quay lại khách hàng">‹</button><div class="thread-name"><strong>Hồ sơ khách hàng</strong></div><button class="outline" data-action="edit">Sửa</button></header><div class="content"><div class="profile-head">${avatar(p)}<h2>${p.name}</h2><p>09•• ••• ••• · Thông tin giả lập</p><div class="profile-actions"><button class="primary" data-page="thread">Nhắn tin</button><button class="outline" data-page="agenda">Lịch hẹn</button></div></div><div class="section"><div class="chips" style="margin:0 0 18px"><button class="chip active">Tổng quan</button><button class="chip" data-action="history">Hoạt động</button><button class="chip" data-action="notes">Ghi chú</button></div><div class="card"><div class="field"><span>Trạng thái</span><b>${p.tag}</b></div><div class="field"><span>Phụ trách</span><b>${p.sale}</b></div><div class="field"><span>Nguồn</span><b>Zalo mẫu</b></div><div class="field"><span>Liên hệ gần nhất</span><b>Hôm nay, 10:42</b></div></div><h2 style="font-size:16px">Ghi chú gần nhất</h2><div class="card muted">Khách muốn tham khảo quy trình và nhận tài liệu trước buổi tư vấn. Đây là ghi chú giả lập.</div></div></div>`}else if(page==='overview'){view.innerHTML=header('Chào buổi sáng,','CỜ RẾP VIỆT · TỔNG QUAN')+`<div class="content"><div class="section"><p class="welcome">Một ngày làm việc rõ ràng hơn.<br>Hôm nay, thứ Năm · Dữ liệu mô phỏng</p><div class="kpis"><div class="kpi"><small>Cần phản hồi</small><strong>08</strong><p>Hội thoại đang chờ</p></div><div class="kpi"><small>Lịch hẹn hôm nay</small><strong>03</strong><p>Việc tiếp theo lúc 14:00</p></div><div class="kpi"><small>Khách hàng mới</small><strong>12</strong><p>Chỉ số giả lập</p></div><div class="kpi"><small>Đã xử lý</small><strong>24</strong><p>Chỉ số giả lập</p></div></div><div class="section-title"><h2>Cần ưu tiên</h2><small>Hội thoại →</small></div><button class="card priority" style="width:100%;text-align:left" data-person="0" data-target="thread">${avatar(people[0])}<span><strong>Anh Nam</strong><p>Đang chờ phản hồi · 8 phút</p></span><span class="arrow">›</span></button><div class="section-title" style="margin-top:25px"><h2>Sắp tới</h2><small>Hôm nay</small></div>${appointment('14:00','Tư vấn mô hình setup','Anh Nam · Cuộc gọi mẫu')}</div></div>`}else if(page==='agenda'){view.innerHTML=header('Lịch hẹn','LÊN KẾ HOẠCH CHO HÔM NAY')+`<div class="content"><div class="section"><div class="section-title"><h2>Tháng 10, 2026</h2><button class="outline" data-action="create">＋ Tạo lịch</button></div><div class="dates">${[['T2','26'],['T3','27'],['T4','28'],['T5','29'],['T6','30']].map(([day,num])=>`<button class="date ${num==='29'?'active':''}" data-action="date">${day}<b>${num}</b></button>`).join('')}</div><div class="section-title"><h2>Hôm nay</h2><small>3 lịch mẫu</small></div>${appointment('09:00','Trao đổi nhu cầu','Chị Linh · Đã hoàn thành')}${appointment('14:00','Tư vấn mô hình setup','Anh Nam · Sắp tới')}${appointment('16:30','Gửi thông tin bổ sung','Anh Hoàng · Sắp tới')}<p class="proto-note">Các lịch trên chỉ minh họa bố cục.<br>Không tạo hay cập nhật lịch thật.</p></div></div>`}else{view.innerHTML=header('Thêm','CÔNG CỤ & TÀI KHOẢN')+`<div class="content"><div class="section"><div class="card priority"><span class="avatar">MA</span><span><strong>Minh Anh · Sale mẫu</strong><p class="muted">Cờ Rếp Việt / Prototype</p></span></div><div class="card">${['Tài khoản của tôi','Kho phương tiện','Báo cáo','Marketing','Cài đặt','Nhân viên & phân quyền'].map(x=>`<button class="menu-row" style="width:100%" data-action="${x}">${x}<span>›</span></button>`).join('')}</div><p class="muted">Khi triển khai, menu lấy cùng quyền và feature flags của CRM. Các mục này chỉ minh họa.</p></div></div>`}renderNav()}
function appointment(t,title,sub){return `<button class="card appointment" style="width:100%;text-align:left" data-action="appointment"><span class="clock">${t}</span><span class="rule"></span><span><h3>${title}</h3><p>${sub}</p></span></button>`}
function renderNav(){const tabs=[['overview','⌂','Tổng quan'],['inbox','▤','Hội thoại'],['customers','♧','Khách hàng'],['agenda','▦','Lịch hẹn'],['more','☷','Thêm']];nav.innerHTML=tabs.map(([p,ic,label])=>`<button data-page="${p}" class="${page===p?'active':''}" ${page===p?'aria-current="page"':''}><span>${ic}</span>${label}</button>`).join('')}
function sheet(title,content,action='close',label='Đóng'){overlay.innerHTML=`<div class="shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle"></div><div class="sheet-head"><h2>${title}</h2><button class="icon" data-action="close" aria-label="Đóng">×</button></div><div class="sheet-body">${content}</div><button class="primary" data-action="${action}">${label}</button><p class="proto-note">Bản thiết kế tương tác · Dữ liệu giả<br>Không gọi API, AI hay dịch vụ bên ngoài.</p></section></div>`;overlay.querySelector('button').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;filter='Tất cả';render();return}if(b.dataset.person!==undefined){selected=Number(b.dataset.person);page=b.dataset.target;render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}const a=b.dataset.action;if(!a)return;if(a==='close'){overlay.innerHTML='';return}if(a==='apply'){overlay.innerHTML='';document.getElementById('draft').value='Dạ, em gửi anh các thông tin cơ bản và quy trình để anh tham khảo. Anh thuận tiện trao đổi thêm vào thời gian nào ạ?';return}if(a==='ai'){sheet('✧ Gợi ý trả lời','Dạ, em gửi anh các thông tin cơ bản và quy trình để anh tham khảo. Anh thuận tiện trao đổi thêm vào thời gian nào ạ?<br><br><span class="badge">Nội dung minh họa · Không gọi AI</span>','apply','Đưa vào ô nhập');return}if(a==='notification'){sheet('Thông báo','Bạn có 3 hội thoại mẫu chưa đọc.<br><br>Đây là trạng thái giả lập, không phải số liệu CRM.');return}if(a==='attachment'){sheet('Đính kèm','🖼 Ảnh / video<br><br>▤ Tài liệu<br><br>Chỉ minh họa vị trí công cụ. Không mở camera, upload hay đọc file thiết bị.');return}sheet(a==='appointment'?'Chi tiết lịch hẹn':'Bản thiết kế',a==='appointment'?'Lịch tư vấn mẫu · Hôm nay<br><br>Hồ sơ: Anh Nam (dữ liệu giả)<br>Trạng thái: Sắp tới<br><br>Form và thao tác trạng thái sẽ tái sử dụng API hiện hữu sau phê duyệt.':'Chức năng này minh họa điểm điều hướng và bố cục. Prototype không thực hiện nghiệp vụ hay sửa dữ liệu.');});document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.innerHTML=''});render();
</script></body></html>
