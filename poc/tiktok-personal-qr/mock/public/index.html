<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>PoC phiên mô phỏng</title>
<style>body{font:16px system-ui;max-width:700px;margin:40px auto;padding:20px;background:#f4f6fa;color:#17243c}section{background:white;padding:24px;border-radius:12px;margin:16px 0}button{padding:10px;margin:6px;cursor:pointer}label{display:block;margin:12px}#qr{font:700 22px monospace;white-space:pre;line-height:1;color:black;background:white;width:max-content;padding:12px;border:2px solid}aside{background:#fff1cb;padding:16px}</style>
<h1>PoC một tài khoản — TT-02</h1><aside>Website độc lập. QR GIẢ không quét được bằng app TikTok. Tin nhắn chỉ là dữ liệu mô phỏng local.</aside>
<section><h2>Phiên</h2><p id="status">Đang tải</p><p id="identity"></p><button id="logout">Đăng xuất / hết phiên</button></section>
<section><h2>Đăng nhập mô phỏng</h2><button id="newqr">Tạo QR giả</button><div id="qr" aria-label="Hình QR giả"></div><p id="expiry"></p><label><input id="wrong" type="checkbox">Thử sai danh tính</label><label><input id="verification" type="checkbox">Cần xác minh bổ sung</label><button id="confirm">Mô phỏng quét và xác nhận</button><button id="verify">Xác minh giả</button><p id="error" role="alert"></p></section>
<section><h2>Hộp thư mock</h2><button id="refresh-messages">Đọc lịch sử</button><div id="messages" data-loading="false"></div>
<label>Tin khách/native giả <input id="inject-text" placeholder="Nội dung thử"></label><select id="inject-direction"><option value="inbound">Khách</option><option value="self">Từ điện thoại giả</option></select><button id="inject">Thêm tin giả</button>
<h3>Gửi fixture (worker CLI mới có ledger)</h3><label>Nội dung <input id="send-text"></label><label>Command ID <input id="command-id"></label><select id="send-fault"><option value="">Bình thường</option><option value="after_accept">Mất ACK sau khi nhận</option></select><button id="send">Gửi mock</button><pre id="send-result" data-command=""></pre></section>
<script>
let csrf,ticket;const $=id=>document.getElementById(id);
async function post(route,body={}){const r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json','X-Mock-CSRF':csrf},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d;}
async function refresh(){const s=await(await fetch('/api/session')).json();document.body.dataset.authenticated=String(s.authenticated);document.body.dataset.account=s.accountId||'';document.body.dataset.verification=String(!!s.needsVerification);$('status').textContent=s.authenticated?(s.needsVerification?'Cần xác minh':'Có phiên; worker phải kiểm danh tính'):'Chưa đăng nhập';$('identity').textContent=s.accountId||'';$('send').disabled=!s.authenticated||s.needsVerification||s.accountId!=='mock-personal-01';}
function action(id,fn){$(id).onclick=async()=>{try{$('error').textContent='';await fn();await refresh();}catch(e){$('error').textContent=e.message;}};}
action('newqr',async()=>{const q=await post('qr');ticket=q.ticket;$('qr').textContent='▛▀▀▜ ▀▄ ▛▀▀▜\n▌██▐ ▄▀ ▌██▐\n▙▄▄▟ ▀▄ ▙▄▄▟\n ▄▀▄ ▀▄▀ ▄▀▄\n▛▀▀▜ ▄▀ ▀▄▀▄\n▌██▐ ▀▄ ▄▀▄▀\n▙▄▄▟ ▄▀ ▀▄▀▄';$('expiry').textContent='QR GIẢ • hết hạn '+new Date(q.expiresAt).toLocaleTimeString();});
action('confirm',async()=>{await post('confirm',{ticket,wrongIdentity:$('wrong').checked,needsVerification:$('verification').checked});ticket=null;$('qr').textContent='';});
action('verify',()=>post('verify'));action('logout',()=>post('logout'));
async function refreshMessages(){const box=$('messages');box.dataset.loading='true';box.dataset.error='';try{const r=await fetch('/api/messages');if(!r.ok)throw Error('IDENTITY_REQUIRED');const d=await r.json();box.replaceChildren();for(const m of d.messages){const row=document.createElement('article');Object.assign(row.dataset,{id:m.id,account:m.accountId,thread:m.threadId,direction:m.direction,sentAt:m.sentAt,command:m.commandId||'',source:m.source});const header=document.createElement('small');header.textContent=m.direction+' • '+m.source;const text=document.createElement('p');text.textContent=m.text;row.append(header,text);box.append(row);}}catch(e){box.replaceChildren();box.dataset.error='read_failed';throw e;}finally{box.dataset.loading='false';}}
action('refresh-messages',refreshMessages);
action('inject',async()=>{await post('inject',{text:$('inject-text').value,direction:$('inject-direction').value});await refreshMessages();});
$('send').onclick=async()=>{const id=$('command-id').value||crypto.randomUUID();$('command-id').value=id;$('send-result').dataset.command='';let ack;try{ack=await post('send',{text:$('send-text').value,commandId:id,fault:$('send-fault').value});}catch(e){ack={commandId:id,error:e.message,rejected:e.message.startsWith('IDENTITY_')||e.message.startsWith('TEXT_')||e.message==='COMMAND_CONFLICT'||e.message==='FIXTURE_LIMIT'};}$('send-result').textContent=JSON.stringify(ack);$('send-result').dataset.command=id;await refreshMessages().catch(()=>{});};
(async()=>{csrf=(await(await fetch('/api/bootstrap')).json()).csrf;await refresh();setInterval(()=>refresh().catch(()=>{$('status').textContent='Mất kết nối mock';}),500);})();
</script></html>
